name: CI

# Manual only. This repository is private, so every minute here is billed
# against a limited budget, and the local VM suite now covers what the hosted
# runners were for: `cargo xtask e2e --target <windows|linux>` runs the real
# desktop suite, and `cargo test` runs everything else on the developer's
# machine. What is lost is the other two operating systems, so run this before
# anything that has to hold on all three. Windows minutes bill at 2x and macOS
# at 10x, which is most of the cost of a full matrix run.
#
# The `os` input narrows the run to one runner, which is what makes a macOS
# check affordable: one job at 10x rather than a matrix of three. The matrix is
# chosen by the `plan` job below rather than filtered by a job-level `if`,
# because `matrix` is not a context a job-level `if` can read; `plan` is a few
# seconds of a 1x runner and it names what it did in its own log.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Which runner to test on"
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

# Read-only. Nothing here writes to the repository, so nothing here needs to be
# able to; `release.yml` is the one workflow that does, and it asks for itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Warnings fail the build. Cargo passes --cap-lints allow to registry
  # dependencies, so this only gates code in this workspace.
  RUSTFLAGS: "-D warnings"

jobs:
  # Which matrix entries this dispatch asked for.
  #
  # The three entries live here as one JSON document rather than in the
  # strategy, because that is the only place an input can reach them. `cache` is
  # spelled out rather than derived from `os` so the Windows job keeps the key
  # it had before the matrix and stays warm. `wrap` is `xvfb-run -a` on Linux:
  # nothing in the suite opens a window today (the Slint UI tests use the
  # testing backend and the desktop e2e suite is #[ignore]d), and the display is
  # here so the first windowed test to arrive runs without a CI change.
  # `xvfb-run -a` does propagate the exit status (verified), so a failing suite
  # still fails the job.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          all='[
            {"name":"Linux","os":"ubuntu-latest","cache":"linux","wrap":"xvfb-run -a"},
            {"name":"Windows","os":"windows-latest","cache":"windows","wrap":""},
            {"name":"macOS","os":"macos-latest","cache":"macos","wrap":""}
          ]'
          asked='${{ inputs.os }}'
          if [ "$asked" = "all" ]; then
            include=$(echo "$all" | jq -c .)
          else
            include=$(echo "$all" | jq -c --arg os "$asked" '[.[] | select(.os == $os)]')
          fi
          if [ "$(echo "$include" | jq length)" = "0" ]; then
            echo "no matrix entry runs on $asked"
            exit 1
          fi
          echo "testing on: $(echo "$include" | jq -r '[.[].name] | join(", ")')"
          echo "include=$include" >> "$GITHUB_OUTPUT"
        shell: bash

  # Formatting is OS-independent, so it runs once rather than per matrix entry,
  # and it goes with the Linux entry rather than beside every dispatch: a macOS
  # check has nothing to say about formatting.
  fmt:
    name: Format
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.include).*.os, 'ubuntu-latest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        shell: bash

  test:
    name: Test (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      # Every OS reports. A Linux failure that cancels the macOS job costs a
      # whole round trip to learn something the same run already knew.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # --- per-OS setup ------------------------------------------------------

      # Slint's documented Linux build dependencies, mesa's Vulkan software
      # driver (lavapipe, which is what the GPU tests run on here), and Xvfb.
      # Installed explicitly rather than relied on from the runner image, which
      # is free to drop any of them.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libclang-dev \
            mesa-vulkan-drivers \
            xvfb
        shell: bash

      # bindgen needs libclang for astronomy-engine-bindings. Windows has no
      # system one, so it is installed and pinned.
      - uses: KyleMayes/install-llvm-action@v2
        if: matrix.os == 'windows-latest'
        with:
          version: "19"
      - name: Set LIBCLANG_PATH
        if: matrix.os == 'windows-latest'
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
        shell: bash

      # Xcode ships a libclang. Point at it only if it is where we expect, so a
      # layout change degrades to clang-sys's own search rather than to a path
      # that does not exist.
      - name: Point bindgen at Xcode's libclang
        if: matrix.os == 'macos-latest'
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
            echo "using $LIB"
          else
            echo "no libclang at $LIB, leaving clang-sys to find it"
          fi
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.cache }}

      # --- the suite ---------------------------------------------------------

      # --show-output because several tests report numbers that are only
      # interesting when they pass: the soak test's per-OS memory profile, and
      # the golden suite's adapter key. libtest discards the output of a passing
      # test otherwise, which is how a golden run that compared nothing looked
      # exactly like one that compared everything.
      #
      # --no-fail-fast because cargo otherwise stops at the first target that
      # fails, and the targets after it then say nothing. One failing engine
      # case has already cost a whole macOS round trip to learn that the golden,
      # soak and shading targets had never run; on a runner that bills at 10x,
      # a run that reports every failure it has is worth the extra minutes.
      - name: Test
        run: ${{ matrix.wrap }} cargo test --locked --no-fail-fast -- --show-output
        shell: bash

      # The headless render path is the useful cross-platform mode today, and
      # the one place all three OSes are asked to produce a real image end to
      # end. Deliberately not wrapped in xvfb on Linux: `run_render` claims to
      # need no window, no Slint backend and no event loop, and running it with
      # no DISPLAY at all is what makes that claim a tested one rather than a
      # comment.
      #
      # It runs whatever the suite made of itself, for the same reason the suite
      # no longer stops at the first failing target: whether this OS can render
      # is not a question a failing case somewhere else answers, and finding out
      # should not cost another run. The binary comes from the test step, so a
      # build that never got that far fails here saying exactly that.
      - name: Render smoke test
        if: ${{ !cancelled() }}
        env:
          # The real binary records metrics and reads the user config. Keep both
          # in the workspace so nothing lands in the runner's app data.
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/smoke-metrics
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/smoke-config.toml
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/smoke-cache
          SUNLIT_EARTH_NO_CLOUDS: "1"
          # An empty directory, on purpose. `textures/**` is Git LFS and
          # `actions/checkout` does not fetch it, so the working tree holds
          # pointer files that look like textures and fail to decode as JXL.
          # The engine then waits two minutes for a `TexturesReady` that cannot
          # arrive (see the roadmap entry on `Renderer::textures_ready`), and
          # the log fills with decode errors that mean nothing. Pointing at an
          # empty directory says what we actually want: render without the 8K
          # assets, on the procedural grid, and tell us whether the pipeline
          # and the PNG encoder work on this OS. Turning on LFS here would
          # exercise the decode too, at the cost of making every run on every
          # OS spend LFS bandwidth quota.
          SUNLIT_EARTH_TEXTURES: ${{ github.workspace }}/smoke-textures
        run: |
          set -euo pipefail
          mkdir -p smoke-textures
          # The binary the test step already built, rather than `cargo run`.
          # `cargo test` builds bins under the test profile (the e2e suite needs
          # one via CARGO_BIN_EXE), and `cargo run` would build them again under
          # dev: 7 minutes of relinking on Windows to produce the same
          # executable. Running the artifact the suite produced is both faster
          # and a slightly better test.
          BIN=target/debug/sunlit-earth
          # An `if` rather than `[ -f x ] && BIN=...`, which would evaluate to
          # false on the three OSes without an .exe and fail the step under
          # `set -e` the moment it became the last statement in the block.
          if [ -f "$BIN.exe" ]; then
            BIN="$BIN.exe"
          fi
          if [ ! -x "$BIN" ]; then
            echo "expected the test step to have built $BIN"
            exit 1
          fi
          "$BIN" render --output render-smoke.png --width 640 --height 360
          # Assert what was asked for: a PNG that is 640x360. A byte count only
          # says the file is not empty, and the failure this guards against is a
          # render that silently came out at the wrong size or was not an image
          # at all. The first 24 bytes of a PNG are the signature, the IHDR
          # length and tag, then width and height as big-endian u32s.
          header=$(od -An -v -tx1 -N24 render-smoke.png | tr -d ' \n')
          expected="89504e470d0a1a0a0000000d494844520000028000000168"
          echo "render-smoke.png header: $header ($(wc -c < render-smoke.png) bytes)"
          if [ "$header" != "$expected" ]; then
            echo "expected a 640x360 PNG, whose first 24 bytes are $expected"
            exit 1
          fi
        shell: bash

      # The contact sheet renders every camera preset into one image. It is not
      # asserted on; it exists so a human can glance at a shading change. Per OS,
      # because the three adapters are exactly what it is worth comparing.
      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.name }}
          path: |
            target/contact-sheet.png
            render-smoke.png
          if-no-files-found: warn
