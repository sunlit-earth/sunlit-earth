name: CI

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Which runner to test on"
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          all='[
            {"name":"Linux","os":"ubuntu-latest","cache":"linux","wrap":"xvfb-run -a"},
            {"name":"Windows","os":"windows-latest","cache":"windows","wrap":""},
            {"name":"macOS","os":"macos-latest","cache":"macos","wrap":""}
          ]'
          asked='${{ inputs.os }}'
          if [ "$asked" = "all" ]; then
            include=$(echo "$all" | jq -c .)
          else
            include=$(echo "$all" | jq -c --arg os "$asked" '[.[] | select(.os == $os)]')
          fi
          if [ "$(echo "$include" | jq length)" = "0" ]; then
            echo "no matrix entry runs on $asked"
            exit 1
          fi
          echo "testing on: $(echo "$include" | jq -r '[.[].name] | join(", ")')"
          echo "include=$include" >> "$GITHUB_OUTPUT"
        shell: bash

  fmt:
    name: Format
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.include).*.os, 'ubuntu-latest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        shell: bash

  test:
    name: Test (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # mesa-vulkan-drivers is lavapipe, which the GPU tests run on here.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libclang-dev \
            mesa-vulkan-drivers \
            xvfb
        shell: bash

      # bindgen needs libclang for astronomy-engine-bindings, and Windows has no
      # system one.
      - uses: KyleMayes/install-llvm-action@v2
        if: matrix.os == 'windows-latest'
        with:
          version: "19"
      - name: Set LIBCLANG_PATH
        if: matrix.os == 'windows-latest'
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
        shell: bash

      - name: Point bindgen at Xcode's libclang
        if: matrix.os == 'macos-latest'
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
            echo "using $LIB"
          else
            echo "no libclang at $LIB, leaving clang-sys to find it"
          fi
        shell: bash

      # cache-on-failure defaults to false, and a dispatch usually exists to
      # look at a failure.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.cache }}
          cache-on-failure: true

      # --show-output because libtest discards a passing test's output, which is
      # how a golden run that compared nothing looked exactly like one that
      # compared everything.
      - name: Test
        run: ${{ matrix.wrap }} cargo test --locked --no-fail-fast -- --show-output
        shell: bash

      # No `matrix.wrap` here on purpose: running with no DISPLAY at all is what
      # makes `run_render`'s claim to need no window and no event loop a tested
      # one rather than a comment.
      - name: Render smoke test
        if: ${{ !cancelled() }}
        env:
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/smoke-metrics
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/smoke-config.toml
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/smoke-cache
          SUNLIT_EARTH_NO_CLOUDS: "1"
          # Empty on purpose. `textures/**` is Git LFS and checkout does not
          # fetch it, so the working tree holds pointer files that fail to decode
          # and leave the engine waiting two minutes for a `TexturesReady` that
          # cannot arrive.
          SUNLIT_EARTH_TEXTURES: ${{ github.workspace }}/smoke-textures
        run: |
          set -euo pipefail
          mkdir -p smoke-textures
          # The binary the test step already built. `cargo run` would build it
          # again under dev: 7 minutes of relinking on Windows for the same
          # executable.
          BIN=target/debug/sunlit-earth
          # An `if` rather than `[ -f x ] && BIN=...`, which evaluates to false on
          # the OSes without an .exe and would fail the step under `set -e`.
          if [ -f "$BIN.exe" ]; then
            BIN="$BIN.exe"
          fi
          if [ ! -x "$BIN" ]; then
            echo "expected the test step to have built $BIN"
            exit 1
          fi
          "$BIN" render --output render-smoke.png --width 640 --height 360
          # PNG signature, IHDR length and tag, then width and height as
          # big-endian u32s: 0x280 by 0x168.
          header=$(od -An -v -tx1 -N24 render-smoke.png | tr -d ' \n')
          expected="89504e470d0a1a0a0000000d494844520000028000000168"
          echo "render-smoke.png header: $header ($(wc -c < render-smoke.png) bytes)"
          if [ "$header" != "$expected" ]; then
            echo "expected a 640x360 PNG, whose first 24 bytes are $expected"
            exit 1
          fi
        shell: bash

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.name }}
          path: |
            target/contact-sheet.png
            render-smoke.png
          if-no-files-found: warn
