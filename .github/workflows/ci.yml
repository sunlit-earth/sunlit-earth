name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs target other PR branches, not main.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # RUSTFLAGS: "-D warnings"

jobs:
  # Formatting is OS-independent, so it runs once rather than per matrix entry.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        shell: bash

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
      - run: cargo test --locked
        shell: bash
      # The contact sheet renders every camera preset into one image. It is
      # not asserted on; it exists so a human can glance at a shading change.
      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: target/contact-sheet.png
          if-no-files-found: warn
