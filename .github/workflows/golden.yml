name: Regenerate golden references

# Review the images before committing them: a golden set regenerated unreviewed
# asserts whatever the code currently does.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner to generate references on"
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # rust-cache folds the RUST* environment into its cache key, so a workflow
  # that omits this restores nothing from the matrix's cache. All four set it.
  RUSTFLAGS: "-D warnings"

jobs:
  regenerate:
    name: Regenerate on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: inputs.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libclang-dev \
            mesa-vulkan-drivers \
            xvfb
        shell: bash

      - uses: KyleMayes/install-llvm-action@v2
        if: inputs.os == 'windows-latest'
        with:
          version: "19"
      - name: Set LIBCLANG_PATH
        if: inputs.os == 'windows-latest'
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
        shell: bash

      - name: Point bindgen at Xcode's libclang
        if: inputs.os == 'macos-latest'
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Resolve the matching CI cache key
        id: cache_key
        run: |
          case "${{ inputs.os }}" in
            ubuntu-latest)
              echo "key=linux" >> "$GITHUB_OUTPUT"
              echo "WRAP=xvfb-run -a" >> "$GITHUB_ENV"
              ;;
            windows-latest) echo "key=windows" >> "$GITHUB_OUTPUT" ;;
            macos-latest)   echo "key=macos"   >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown runner ${{ inputs.os }}"; exit 1 ;;
          esac
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ steps.cache_key.outputs.key }}
          cache-on-failure: true

      - name: Regenerate
        id: regenerate
        env:
          SUNLIT_EARTH_UPDATE_GOLDEN: "1"
        run: |
          set -euo pipefail
          # --nocapture so the test's adapter key marker reaches the log; the
          # sed below is the only way this job learns which adapter ran.
          ${WRAP:-} cargo test -p sunlit-core --test golden --locked -- --nocapture \
            | tee golden.log
          keys=$(sed -n 's/^golden adapter key: //p' golden.log | sort -u)
          count=$(printf '%s\n' "$keys" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "expected exactly one adapter key in the test output, got: $keys"
            exit 1
          fi
          echo "key=$keys" >> "$GITHUB_OUTPUT"
          echo "regenerated the $keys reference set"
        shell: bash

      # Regeneration short-circuits every comparison, so the run above proves
      # only that the renders were written. This second pass is what verifies.
      - name: Verify the regenerated set
        run: |
          set -euo pipefail
          ${WRAP:-} cargo test -p sunlit-core --test golden --locked -- --show-output
        shell: bash

      # Only the adapter that ran: an archive of all three, extracted over the
      # tracked directory, would silently revert the other two.
      - name: Upload references
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ steps.regenerate.outputs.key }}
          path: crates/sunlit-core/tests/golden/${{ steps.regenerate.outputs.key }}/
          if-no-files-found: error
