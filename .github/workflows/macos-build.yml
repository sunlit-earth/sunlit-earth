name: macOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options:
          - check
          - build
          - build-and-e2e
      interactive:
        description: "Open a screen sharing session on the runner once the mode's work is done."
        type: boolean
        default: false
      interactive_minutes:
        description: "How long to hold that session open."
        type: number
        default: 30
      runner:
        description: "Which image, and so which architecture is built. Intel is 4 vCPU and 14 GB against Apple Silicon's 3 and 7."
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-26-intel

concurrency:
  group: macos-build-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  macos:
    name: ${{ inputs.mode }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    # Each image builds for its own architecture, because the bundle and e2e
    # steps run what was built.
    env:
      TARGET: ${{ inputs.runner == 'macos-26-intel' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.mode != 'check' }}

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
        shell: bash

      - name: Point bindgen at Xcode's libclang
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
            echo "using $LIB"
          else
            echo "no libclang at $LIB, leaving clang-sys to find it"
          fi
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.mode == 'check' && 'ci-macos' || inputs.mode == 'build' && 'release-macos' || 'macos-build-e2e' }}
          cache-on-failure: true

      - name: Check
        if: inputs.mode == 'check'
        run: cargo check --all-targets --locked
        shell: bash

      - name: Unit tests
        if: inputs.mode == 'check'
        run: cargo test --workspace --lib --bins --locked -- --show-output
        shell: bash

      - name: Build
        if: inputs.mode != 'check'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked -p sunlit-earth --bin sunlit-earth --target "$TARGET"
        shell: bash

      - name: Bundle and verify
        if: inputs.mode != 'check'
        env:
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/bundle-config.toml
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/bundle-metrics
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/bundle-cache
          SUNLIT_EARTH_NO_CLOUDS: "1"
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo xtask bundle --platform macos \
            --exe target/$TARGET/release/sunlit-earth --out "${{ github.workspace }}/dist" --verify
          echo "bundle step took $(( $(date +%s) - start )) s, xtask compile included"
          ls -l "${{ github.workspace }}/dist"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'check'
        with:
          name: bundle-macos-${{ env.TARGET }}
          path: dist/
          if-no-files-found: error

      - name: Put the app on the Desktop
        if: ${{ inputs.interactive && inputs.mode != 'check' && !cancelled() }}
        run: |
          set -euo pipefail
          ditto -x -k dist/sunlit-earth-*-macos.zip "$HOME/Desktop"
          ls -ld "$HOME/Desktop/Sunlit Earth.app"
        shell: bash

      - name: What this session has
        if: inputs.mode == 'build-and-e2e'
        run: |
          set -euo pipefail
          mkdir -p e2e-out
          system_profiler SPDisplaysDataType | tee e2e-out/displays-system-profiler.txt
          "$(pwd)/target/$TARGET/release/sunlit-earth" displays | tee e2e-out/displays.txt
          screencapture -x e2e-out/desktop-before.png || echo "screencapture refused; the suite is the test, this is only evidence"
        shell: bash

      # No SUNLIT_EARTH_NO_CLOUDS here: it is presence-only and every child
      # inherits it, which starves the cloud case of the downloads it waits
      # for. The harness sets it itself for the cases that want it.
      - name: Desktop e2e suite
        if: inputs.mode == 'build-and-e2e'
        env:
          SUNLIT_EARTH_E2E_WALLPAPER: "1"
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/e2e-config.toml
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/e2e-metrics
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/e2e-cache
        run: |
          set -euo pipefail
          mkdir -p e2e-out
          cargo e2e 2>&1 | tee e2e-out/e2e.log
        shell: bash

      - name: What the desktop looks like now
        if: ${{ inputs.mode == 'build-and-e2e' && !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p e2e-out
          screencapture -x e2e-out/desktop-after.png || echo "screencapture refused; the suite is the test, this is only evidence"
          ls -l e2e-out
        shell: bash

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'build-and-e2e' && !cancelled() }}
        with:
          name: e2e-macos-${{ env.TARGET }}
          path: e2e-out/
          if-no-files-found: warn

      # A hosted runner accepts no inbound connection, so the session is dialled
      # from inside. The node is ephemeral and answers on a 100.x address that
      # routes only from this tailnet, which is why printing it below is safe.
      - name: Join the tailnet
        if: ${{ inputs.interactive && !cancelled() }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Apple's own server authenticates and then streams black: the image grants
      # screen capture to the runner's process tree and not to screensharingd's
      # agent. macVNC, started as a child of the hold step below, inherits that
      # grant.
      - name: Build a VNC server
        id: screen
        if: ${{ inputs.interactive && !cancelled() }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install libvncserver 2>&1 | tail -3
          # The Intel bottle's CMake export names libsasl2 inside the SDK of the
          # machine that built it, which this image does not have.
          sdk=$(xcrun --show-sdk-path)
          grep -rlE '/SDKs/MacOSX[0-9.]*\.sdk' "$(brew --prefix libvncserver)/lib/cmake" 2>/dev/null \
            | while read -r f; do
                sed -i '' -E "s#/[^;\"]*/SDKs/MacOSX[0-9.]*\\.sdk#$sdk#g" "$f"
              done
          src="$RUNNER_TEMP/macVNC"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/LibVNC/macVNC 6c45640168dd170120d96661b3b711d283257166
          git -C "$src" checkout -q FETCH_HEAD
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$src/build"
        shell: bash

      # Legacy VNC auth uses the password as a DES key and keeps the first eight
      # characters, so a `VNC_PASSWORD` longer than that is not stronger.
      - name: Hold the session open
        if: ${{ inputs.interactive && !cancelled() && steps.screen.outcome == 'success' }}
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MINUTES: ${{ inputs.interactive_minutes }}
        run: |
          set -euo pipefail
          if [ "${#VNC_PASSWORD}" -gt 8 ]; then
            echo "VNC_PASSWORD must be eight characters or fewer; legacy auth reads no more"
            exit 1
          fi
          # Bash evaluates a bare name inside $(( )) as an expression, so a value
          # that is not a number is a way to run a command there.
          case "$MINUTES" in
            '' | *[!0-9]*) echo "interactive_minutes must be a whole number"; exit 1 ;;
          esac
          # Once the display sleeps there is no way to wake it from here.
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 || true
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPassword -int 0 || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow DisableScreenLock -bool true || true
          mkdir -p session-out
          "$RUNNER_TEMP/macVNC/build/macVNC.app/Contents/MacOS/macVNC" \
            -rfbport 5900 -passwd "$VNC_PASSWORD" > session-out/macvnc.log 2>&1 &
          for _ in $(seq 1 15); do
            sudo lsof -nP -iTCP:5900 -sTCP:LISTEN > /dev/null 2>&1 && break
            sleep 1
          done
          if ! sudo lsof -nP -iTCP:5900 -sTCP:LISTEN > /dev/null 2>&1; then
            echo "macVNC is not listening on 5900"
            cat session-out/macvnc.log
            exit 1
          fi
          echo "connect a VNC client to $(tailscale ip -4):5900, password only, no user name"
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ -e /tmp/release-the-runner ]; then
              echo "released from inside the session"
              break
            fi
            sleep 10
          done
          cp -R "$HOME/Library/Application Support/SunlitEarth" session-out/app-data 2>/dev/null \
            || echo "the app wrote no data directory"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.interactive && always() }}
        with:
          name: session-${{ inputs.runner }}
          path: session-out/
          if-no-files-found: warn
