name: macOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options:
          - check

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  macos:
    name: ${{ inputs.mode }} on macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
        shell: bash

      - name: Point bindgen at Xcode's libclang
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
            echo "using $LIB"
          else
            echo "no libclang at $LIB, leaving clang-sys to find it"
          fi
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos

      - name: Check
        if: inputs.mode == 'check'
        run: cargo check --all-targets --locked
        shell: bash

      - name: Unit tests
        if: inputs.mode == 'check'
        run: cargo test --workspace --lib --bins --locked -- --show-output
        shell: bash
