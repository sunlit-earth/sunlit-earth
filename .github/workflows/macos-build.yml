name: macOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options:
          - check
          - build
          - build-and-e2e
      universal:
        description: "Build the binary for Intel as well as Apple Silicon."
        type: boolean
        default: false
      interactive:
        description: "Open a screen sharing session on the runner once the mode's work is done."
        type: boolean
        default: false
      interactive_minutes:
        description: "How long to hold that session open."
        type: number
        default: 30

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  macos:
    name: ${{ inputs.mode }} on macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.mode != 'check' }}

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          rustup show active-toolchain
        shell: bash

      - name: Point bindgen at Xcode's libclang
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
            echo "using $LIB"
          else
            echo "no libclang at $LIB, leaving clang-sys to find it"
          fi
        shell: bash

      # `cache-on-failure` defaults to false, which costs more here than
      # anywhere else in this repository. Every workflow is dispatch-only, so a
      # run exists because somebody wanted an answer, and the answer they most
      # often want is why something failed. Without this, the run that finds a
      # failure saves nothing, and the run that goes back to look at it
      # recompiles the workspace from cold. The `interactive` input makes that
      # sharper still: the session steps run under `!cancelled()` so the desktop
      # is there whatever the suite did, but the job still concludes as failed,
      # so a debugging session could never warm anything.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ inputs.mode == 'check' && 'ci-macos' || inputs.mode == 'build' && 'release-macos' || 'macos-build-e2e' }}
          cache-on-failure: true

      - name: Check
        if: inputs.mode == 'check'
        run: cargo check --all-targets --locked
        shell: bash

      - name: Unit tests
        if: inputs.mode == 'check'
        run: cargo test --workspace --lib --bins --locked -- --show-output
        shell: bash

      - name: Build
        if: inputs.mode != 'check'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          build() {
            cargo build --release --locked -p sunlit-earth --bin sunlit-earth --target "$1"
          }
          build aarch64-apple-darwin
          mkdir -p dist-bin
          if [ "${{ inputs.universal }}" = "true" ]; then
            rustup target add x86_64-apple-darwin
            build x86_64-apple-darwin
            lipo -create -output dist-bin/sunlit-earth target/aarch64-apple-darwin/release/sunlit-earth target/x86_64-apple-darwin/release/sunlit-earth
            echo "the x86_64 slice was built and not executed: nothing here installs Rosetta or runs it, so only the arm64 half of this binary has been shown to start"
          else
            cp target/aarch64-apple-darwin/release/sunlit-earth dist-bin/sunlit-earth
          fi
          lipo -info dist-bin/sunlit-earth
        shell: bash

      - name: Bundle and verify
        if: inputs.mode != 'check'
        env:
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/bundle-config.toml
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/bundle-metrics
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/bundle-cache
          SUNLIT_EARTH_NO_CLOUDS: "1"
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo xtask bundle --platform macos \
            --exe dist-bin/sunlit-earth --out "${{ github.workspace }}/dist" --verify
          echo "bundle step took $(( $(date +%s) - start )) s, xtask compile included"
          ls -l "${{ github.workspace }}/dist"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'check'
        with:
          name: bundle-macos
          path: dist/
          if-no-files-found: error

      - name: What this session has
        if: inputs.mode == 'build-and-e2e'
        run: |
          set -euo pipefail
          mkdir -p e2e-out
          system_profiler SPDisplaysDataType | tee e2e-out/displays-system-profiler.txt
          "$(pwd)/dist-bin/sunlit-earth" displays | tee e2e-out/displays.txt
          screencapture -x e2e-out/desktop-before.png || echo "screencapture refused; the suite is the test, this is only evidence"
        shell: bash

      - name: Desktop e2e suite
        if: inputs.mode == 'build-and-e2e'
        env:
          SUNLIT_EARTH_E2E_WALLPAPER: "1"
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/e2e-config.toml
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/e2e-metrics
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/e2e-cache
          SUNLIT_EARTH_NO_CLOUDS: "1"
        run: |
          set -euo pipefail
          mkdir -p e2e-out
          cargo e2e 2>&1 | tee e2e-out/e2e.log
        shell: bash

      - name: What the desktop looks like now
        if: ${{ inputs.mode == 'build-and-e2e' && !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p e2e-out
          screencapture -x e2e-out/desktop-after.png || echo "screencapture refused; the suite is the test, this is only evidence"
          ls -l e2e-out
        shell: bash

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'build-and-e2e' && !cancelled() }}
        with:
          name: e2e-macos
          path: e2e-out/
          if-no-files-found: warn

      # --- the session somebody watches --------------------------------------

      # Every mode above reports what a Mac did in a log somebody reads
      # afterwards. `interactive` is the other half: it holds the runner open
      # so the desktop can be looked at while it is still there. It composes
      # with all three modes rather than being a fourth, so the session can
      # start on a machine that has just compiled, just bundled, or just run
      # the e2e suite and still has its wallpaper on the screen. It also
      # compiles nothing of its own, which is why the cache key above is a
      # function of `mode` alone.
      #
      # `!cancelled()` rather than the default, because a failed build is the
      # case where looking is worth most. The steps come after the uploads so
      # the artifacts exist before anybody starts poking at the machine.

      # A hosted runner accepts no inbound connection: multi-tenant, behind
      # NAT, and GitHub's own guidance is that nothing ever needs to reach in.
      # So the session is dialled from inside. The runner joins the tailnet as
      # an ephemeral node, tagged `tag:ci` and logged out again by the time the
      # job ends, and its screen answers on a 100.x address that routes only
      # from machines already on that tailnet. That is the whole of the access
      # control, and it is why the address below is safe to print here.
      #
      # A public tunnel would do the same job and was rejected twice over: it
      # puts a reachable address in a public repository's logs, and it meters
      # the stream. A desktop rendering the Earth is a continuously changing
      # image, which is the worst case for a delta encoder, and spends a
      # gigabyte of monthly allowance in well under an hour.
      - name: Join the tailnet
        if: ${{ inputs.interactive && !cancelled() }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Apple's own screen sharing server rather than a third-party one,
      # because it is a system service and therefore exempt from the Screen
      # Recording consent that a capture tool would have to be clicked through,
      # and there is nobody here to click it.
      #
      # The password goes through the legacy VNC path so that every client can
      # speak it, Apple's own authentication being something only some of them
      # implement. That protocol uses the password as a DES key and keeps the
      # first eight characters, so `VNC_PASSWORD` is eight characters long and
      # a longer secret would be a longer secret and not a stronger one. The
      # runner account is logged in with no lock screen, so a connection lands
      # on the desktop without an account password in the picture at all.
      - name: Open a screen sharing session
        if: ${{ inputs.interactive && !cancelled() }}
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          kickstart=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$kickstart" -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD"
          sudo "$kickstart" -activate -configure -access -on -restart -agent -privs -all
          if command -v tailscale > /dev/null; then
            echo "connect a VNC client to $(tailscale ip -4):5900, password only, no user name"
          else
            echo "the tailscale CLI is not on PATH; take the address from the Join the tailnet step above"
          fi
        shell: bash

      # The job is the session's lifetime, so the last step is the session.
      # The sentinel is the way out: `touch /tmp/release-the-runner` from a
      # terminal inside the session ends the job at once instead of running the
      # clock down, which is worth doing because the tailnet's free allowance
      # is a monthly pool of ephemeral node minutes rather than a per-session
      # limit. The first frame after connecting is often black, and that is the
      # console session switching rather than a failure: reconnect.
      - name: Hold the session open
        if: ${{ inputs.interactive && !cancelled() }}
        env:
          MINUTES: ${{ inputs.interactive_minutes }}
        run: |
          set -euo pipefail
          # Bash evaluates a bare name inside $(( )) as an expression, so a
          # value that is not a number is a way to run a command here. The
          # dispatch form already types this input as a number; this is the
          # half of that which does not depend on the form.
          case "$MINUTES" in
            '' | *[!0-9]*) echo "interactive_minutes must be a whole number"; exit 1 ;;
          esac
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ -e /tmp/release-the-runner ]; then
              echo "released from inside the session"
              exit 0
            fi
            sleep 10
          done
          echo "held for $MINUTES minutes"
        shell: bash
