name: macOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: check
        type: choice
        options:
          - check
          - build
          - build-and-e2e
      universal:
        description: "Build the binary for Intel as well as Apple Silicon."
        type: boolean
        default: false
      interactive:
        description: "Open a screen sharing session on the runner once the mode's work is done."
        type: boolean
        default: false
      interactive_minutes:
        description: "How long to hold that session open."
        type: number
        default: 30
      runner:
        description: "Which image. Intel is 4 vCPU and 14 GB against Apple Silicon's 3 and 7, and takes check only."
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-26-intel

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  macos:
    name: vnc experiment on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      OUT: ${{ github.workspace }}/session-out
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare the session
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 || true
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ83WRwidH1JyERg9/ckhDlirY9ihG0uKumpFt5jdDWG runner-probe" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          {
            echo "tailscale ip: $(tailscale ip -4)"
            sw_vers
            csrutil status
            echo "user: $(whoami), console: $(stat -f%Su /dev/console)"
            echo "== ancestors of this step =="
            pid=$$
            while [ "${pid:-1}" -gt 1 ]; do
              ps -o pid=,ppid=,user=,command= -p "$pid"
              pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
            done
            echo "== listening =="
            sudo lsof -nP -iTCP -sTCP:LISTEN
          } 2>&1 | tee "$OUT/prepare.txt"
          screencapture -x "$OUT/desktop.png" && echo "desktop.png: $(stat -f%z "$OUT/desktop.png") bytes"
        shell: bash

      - name: Build macVNC
        run: |
          set -euo pipefail
          brew install libvncserver 2>&1 | tail -3
          git clone --depth 1 https://github.com/LibVNC/macVNC "$RUNNER_TEMP/macVNC"
          cmake -S "$RUNNER_TEMP/macVNC" -B "$RUNNER_TEMP/macVNC/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/macVNC/build"
          ls -l "$RUNNER_TEMP/macVNC/build/macVNC.app/Contents/MacOS/"
        shell: bash

      # The server is a child of this step, which is what gives it the screen
      # capture grant the image makes to the runner's process tree. Started over
      # SSH it would not have it.
      - name: Hold the session open
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MINUTES: ${{ inputs.interactive_minutes }}
        run: |
          set -uo pipefail
          case "$MINUTES" in
            '' | *[!0-9]*) echo "interactive_minutes must be a whole number"; exit 1 ;;
          esac
          app="$RUNNER_TEMP/macVNC/build/macVNC.app/Contents/MacOS/macVNC"
          "$app" -rfbport 5900 -passwd "$VNC_PASSWORD" > "$OUT/macvnc.log" 2>&1 &
          echo "macVNC pid $!"
          sleep 5
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || echo "nothing on 5900"
          tail -20 "$OUT/macvnc.log"
          echo "connect a VNC client to $(tailscale ip -4):5900"
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ] && [ ! -e /tmp/release-the-runner ]; do
            sleep 10
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-${{ inputs.runner }}
          path: session-out/
          if-no-files-found: warn
