name: Release

# Manual only. Release artifacts are currently built with `cargo xtask dist`, which
# compiles in clean VMs. Proper GitHub action builds will come later.
#
# Until then every `startsWith(github.ref, 'refs/tags/')` below is false and the
# logic behind it dormant, kept for the day the tag trigger comes back.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release. Off means build and verify only."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # Every build runs on a runner of its own architecture, so the bundle step
    # executes the binary it verifies natively rather than under emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: sunlit-earth.exe
          - platform: linux
            arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: sunlit-earth
          - platform: linux
            arch: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            exe: sunlit-earth
          - platform: macos
            arch: x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
            exe: sunlit-earth
          - platform: macos
            arch: aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: sunlit-earth
    env:
      # RUSTFLAGS replaces `[target.<triple>] rustflags` in .cargo/config.toml
      # rather than adding to it, so the static C runtime the config asks for on
      # Windows has to be repeated here or the binary imports vcruntime140.dll.
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
      EXE: target/${{ matrix.target }}/release/${{ matrix.exe }}
    steps:
      - name: Refuse to publish from anything but a tag
        if: ${{ inputs.publish && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "publish=true names a release after ${GITHUB_REF_NAME}, which is not a tag,"
          echo "and the version gate below only runs on one. Push the tag instead;"
          echo "a dispatch is the dry run, which is publish=false."
          exit 1
        shell: bash

      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "this runner's host is $host, and the job builds ${{ matrix.target }} natively"
            exit 1
          fi
        shell: bash

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libclang-dev \
            mesa-vulkan-drivers
        shell: bash

      - uses: KyleMayes/install-llvm-action@v2
        if: matrix.platform == 'windows'
        with:
          version: "19"
      - name: Set LIBCLANG_PATH
        if: matrix.platform == 'windows'
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
        shell: bash

      - name: Point bindgen at Xcode's libclang and set the deployment target
        if: matrix.platform == 'macos'
        run: |
          LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          if [ -f "$LIB/libclang.dylib" ]; then
            echo "LIBCLANG_PATH=$LIB" >> "$GITHUB_ENV"
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}-${{ matrix.arch }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-on-failure: true

      - name: Check the tag against the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "cannot read the workspace version out of Cargo.toml"
            exit 1
          fi
          echo "workspace version: $version, tag: ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "the tag ${GITHUB_REF_NAME} does not name the workspace version $version."
            echo "Bump [workspace.package] version, or tag v$version."
            exit 1
          fi
        shell: bash

      - name: Build
        run: cargo build --release --locked -p sunlit-earth --bin sunlit-earth --target ${{ matrix.target }}
        shell: bash

      - name: Check the binary's linkage
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows)
              if grep -aqiE 'vcruntime140|msvcp140' "$EXE"; then
                echo "the binary imports the dynamic C runtime, so it needs the Visual C++ redistributable"
                exit 1
              fi
              echo "no import of vcruntime140.dll or msvcp140.dll"
              ;;
            linux)
              readelf -h "$EXE" | grep -E 'Class|Machine'
              readelf -d "$EXE" | grep NEEDED
              floor=$(objdump -T "$EXE" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
              echo "glibc floor: $floor"
              ;;
            macos)
              lipo -info "$EXE"
              otool -l "$EXE" | grep -A3 LC_BUILD_VERSION | grep -E 'minos|sdk'
              otool -L "$EXE"
              ;;
          esac
        shell: bash

      - name: Bundle and verify
        env:
          SUNLIT_EARTH_CONFIG: ${{ github.workspace }}/bundle-config.toml
          SUNLIT_EARTH_METRICS_DIR: ${{ github.workspace }}/bundle-metrics
          SUNLIT_EARTH_CACHE_DIR: ${{ github.workspace }}/bundle-cache
          SUNLIT_EARTH_NO_CLOUDS: "1"
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo xtask bundle --platform ${{ matrix.platform }} \
            --exe "$EXE" --out dist --verify
          echo "bundle step took $(( $(date +%s) - start )) s, xtask compile included"
          if ! grep -q '"arch": "${{ matrix.arch }}"' dist/build-info.json; then
            echo "the record names another architecture than ${{ matrix.arch }}"
            exit 1
          fi
          ls -l dist
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bundle-*

      - name: Collect the release assets
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/bundle-*; do
            build=${dir#artifacts/bundle-}
            for archive in "$dir"/*.zip "$dir"/*.tar.gz; do
              [ -f "$archive" ] || continue
              cp "$archive" release/
            done
            if [ -f "$dir/build-info.json" ]; then
              cp "$dir/build-info.json" "release/build-info-${build}.json"
            else
              echo "the $build bundle wrote no record"
              exit 1
            fi
          done
          ls -l release
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
