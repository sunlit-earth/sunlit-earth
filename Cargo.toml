[package]
name = "sunlit-earth"
version = "0.1.0"
edition = "2024"
description = "A desktop application that renders a realistic 3D view of Earth as seen from space and sets it as the wallpaper"
license = "GPL-3.0-or-later"

[dependencies]
slint = { version = "~1.15", features = ["unstable-wgpu-28"] }
wgpu = "28"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
jxl-oxide = { version = "0.12", default-features = false, features = ["image", "rayon"] }
astronomy-engine-bindings = "2.1"
time = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Registry",
] }
tray-icon = "0.21"
muda = "0.17"

[dev-dependencies]
approx = "0.5"
proptest = "1"

[build-dependencies]
slint-build = "~1.15"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic includes some noisy lints — suppress the ones that aren't useful
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "deny"

[profile.dev.package."*"]
# Optimize dependencies even in dev builds — important for GPU/math crates
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
