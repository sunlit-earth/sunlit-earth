[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1-beta.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sunlit-earth/sunlit-earth"

[workspace.dependencies]
slint = "~1.17"
raw-window-handle = "0.6"
slint-build = "~1.17"
wgpu = { version = "28", features = ["counters"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
jxl-oxide = { version = "0.12", default-features = false, features = ["image", "rayon"] }
astronomy-engine-bindings = "2.1"
time = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
crc32fast = "1"
csv = "1"
dirs = "6"
resvg = { version = "0.48", default-features = false }
ico = "0.5"
icns = { version = "0.4", default-features = false, features = ["pngio"] }
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
flate2 = "1"
embed-resource = "3"
tracing = { version = "0.1", features = ["max_level_trace", "release_max_level_warn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
log = { version = "0.4", features = ["max_level_trace", "release_max_level_warn"] }
single-instance = "0.3"
interprocess = "2"
crossbeam-channel = "0.5"
windows-sys = "0.59"
windows = "0.62"
winreg = "0.56"
mach2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSScreen", "NSCell"] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSURL",
    "NSDictionary",
    "NSValue",
    "NSArray",
    "NSError",
] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFString", "CFUUID"] }
objc2-core-graphics = { version = "0.3", features = [
    "libc",
    "CGError",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
] }
objc2-color-sync = { version = "0.3", features = ["ColorSyncDevice"] }
dispatch2 = "0.3"
signal-hook = "0.3"
x11rb = { version = "0.13", default-features = false, features = ["randr", "image"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
zbus = { version = "5.14", default-features = false, features = ["async-io", "blocking-api"] }
wayland-client = "0.31"
approx = "0.5"
proptest = "1"
serial_test = "3"
i-slint-backend-testing = "=1.17.1"
regex-lite = "0.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
