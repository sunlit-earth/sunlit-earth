  <circle cx="32" cy="32" r="27.6" fill="none" stroke="#9A91D4" stroke-width="4.8"/>
  <path d="M13.0 11.9 A27.6 27.6 0 0 1 30.4 4.5" fill="none"
      stroke="url(#auroraTop)" stroke-width="4.8"/>
  <path d="M51.0 52.1 A27.6 27.6 0 0 1 33.6 59.6" fill="none"
