[package]
name = "sunlit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless rendering engine for Sunlit Earth"
publish = false

[dependencies]
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
image.workspace = true
ureq.workspace = true
jxl-oxide.workspace = true
astronomy-engine-bindings.workspace = true
time.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Com"] }
winreg.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
zbus.workspace = true
wayland-client.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-color-sync.workspace = true
dispatch2.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true

[lints]
workspace = true
