[project]
name = "cloud-fetch"
version = "0.1.0"
description = "Fetch and process satellite cloud imagery for Sunlit Earth"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35",
    "netcdf4>=1.7",
    "numpy>=2.0",
    "pillow>=11.0",
    "scipy>=1.14",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
cloud-fetch = "cloud_fetch.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cloud_fetch"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
