[project]
name = "texture-pipeline"
version = "0.1.0"
description = "Convert NASA Blue Marble textures to JPEG XL at multiple resolutions"
requires-python = ">=3.14"
dependencies = [
    "pillow>=11.0",
    "pillow-jxl-plugin>=1.3.7",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
texture-pipeline = "texture_pipeline.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["texture_pipeline"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
